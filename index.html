<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>每日母婴亲子热点</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fef9f4;color:#333;padding:16px;}
    h1{text-align:center;font-size:1.8em;color:#d9736e;margin-bottom:8px;}
    .update-time{text-align:center;font-size:0.85em;color:#999;margin-bottom:20px;}
    .news-list{list-style:none;display:flex;flex-direction:column;gap:12px;}
    .news-item{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 2px 12px rgba(0,0,0,0.05);display:flex;align-items:flex-start;justify-content:space-between;transition:all 0.2s;}
    .news-item:active{background:#fff5f3;}
    .news-content{flex:1;min-width:0;}
    .news-title{font-size:1.05em;font-weight:600;line-height:1.4;color:#222;word-break:break-word;display:block;text-decoration:none;}
    .news-title:visited{color:#8e6b6b;}
    .news-source{font-size:0.8em;color:#aaa;margin-top:6px;}
    .pick-btn{flex-shrink:0;margin-left:12px;background:#ffe8e5;border:none;border-radius:20px;padding:8px 16px;font-size:0.9em;color:#d9736e;font-weight:600;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
    .pick-btn:active{background:#fcd5ce;transform:scale(0.95);}
    .pick-btn.picked{background:#d9736e;color:#fff;}
    .my-picks{margin-top:30px;background:#fff;border-radius:20px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,0.05);}
    .my-picks h2{font-size:1.2em;color:#d9736e;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
    .clear-btn{font-size:0.8em;background:none;border:1px solid #d9736e;color:#d9736e;border-radius:12px;padding:4px 12px;cursor:pointer;}
    .pick-list{list-style:none;display:flex;flex-direction:column;gap:8px;}
    .pick-list li{font-size:0.95em;line-height:1.4;border-bottom:1px solid #f5f5f5;padding-bottom:6px;word-break:break-word;}
    .copy-btn{display:block;margin:16px auto 0;background:#d9736e;color:#fff;border:none;border-radius:24px;padding:12px 28px;font-size:1em;font-weight:600;cursor:pointer;width:100%;max-width:280px;}
    .copy-btn:active{background:#c1625e;}
    .footer{text-align:center;font-size:0.7em;color:#ccc;margin-top:30px;}
  </style>
</head>
<body>
  <h1>🍼 每日母婴热点</h1>
  <div class="update-time" id="updateTime">加载中...</div>
  <ul class="news-list" id="newsList"></ul>

  <div class="my-picks" id="pickPanel">
    <h2>
      📌 我的选取 <span id="pickCount">0</span>条
      <button class="clear-btn" id="clearPicks">清空</button>
    </h2>
    <ul class="pick-list" id="pickList"></ul>
    <button class="copy-btn" id="copyPicks">一键复制选取内容</button>
  </div>
  <div class="footer">每日自动更新 · 数据来源网络</div>

  <script>
    (function() {
      const newsListEl = document.getElementById('newsList');
      const updateTimeEl = document.getElementById('updateTime');
      const pickListEl = document.getElementById('pickList');
      const pickCountEl = document.getElementById('pickCount');
      const clearBtn = document.getElementById('clearPicks');
      const copyBtn = document.getElementById('copyPicks');

      let picks = JSON.parse(localStorage.getItem('baby_picks') || '[]');

      function renderPicks() {
        pickListEl.innerHTML = picks.map((item, idx) => 
          `<li>${idx+1}. ${item.title} <br><small style="color:#999">${item.link}</small></li>`
        ).join('');
        pickCountEl.textContent = picks.length;
        localStorage.setItem('baby_picks', JSON.stringify(picks));
      }

      function togglePick(title, link, btn) {
        const idx = picks.findIndex(p => p.link === link);
        if (idx > -1) {
          picks.splice(idx, 1);
          btn.classList.remove('picked');
          btn.textContent = '选取';
        } else {
          picks.push({title, link});
          btn.classList.add('picked');
          btn.textContent = '已选';
        }
        renderPicks();
      }

      function isPicked(link) {
        return picks.some(p => p.link === link);
      }

      fetch('hot.json')
        .then(res => res.json())
        .then(data => {
          updateTimeEl.textContent = '更新时间：' + (data.update_time || '未知');
          const items = data.items || [];
          newsListEl.innerHTML = items.map(item => {
            const picked = isPicked(item.link);
            return `
              <li class="news-item">
                <div class="news-content">
                  <a class="news-title" href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
                  <div class="news-source">${item.source || '未知来源'}</div>
                </div>
                <button class="pick-btn${picked?' picked':''}" data-title="${item.title.replace(/"/g, '&quot;')}" data-link="${item.link}">${picked?'已选':'选取'}</button>
              </li>
            `;
          }).join('');

          document.querySelectorAll('.pick-btn').forEach(btn => {
            btn.addEventListener('click', function() {
              const title = this.dataset.title;
              const link = this.dataset.link;
              togglePick(title, link, this);
            });
          });
        })
        .catch(() => {
          newsListEl.innerHTML = '<li style="text-align:center;color:#999;">热点加载失败，请稍后刷新</li>';
        });

      renderPicks();

      clearBtn.addEventListener('click', () => {
        picks = [];
        renderPicks();
        document.querySelectorAll('.pick-btn').forEach(btn => {
          btn.classList.remove('picked');
          btn.textContent = '选取';
        });
      });

      copyBtn.addEventListener('click', () => {
        if (picks.length === 0) {
          alert('请先选取热点');
          return;
        }
        const text = picks.map((p, i) => `${i+1}. ${p.title}\n${p.link}`).join('\n\n');
        navigator.clipboard.writeText(text).then(() => {
          alert('已复制到剪贴板');
        }).catch(() => {
          prompt('手动复制吧', text);
        });
      });
    })();
  </script>
</body>
</html>
